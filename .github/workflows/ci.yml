name: CI

# Main checks merged code and refreshes shared caches; browser tests run on PRs only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every job times out at 6 minutes, so a change that makes CI slow fails its PR instead of
  # quietly adding minutes (AGENTS.md "Verifying changes"). The e2e shards start once `check` passes.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm --filter @atlas/content validate

      - run: pnpm test

      # PR-scoped caches cannot be restored by other PRs. Refresh the shared browser cache
      # on main without building the export, installing system dependencies, or running e2e.
      - name: Playwright version
        if: github.event_name == 'push'
        id: playwright
        run: echo "version=$(pnpm --filter @atlas/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers for PRs
        if: github.event_name == 'push'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Must match the e2e job's browser-cache key.
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          lookup-only: true

      - name: Install Playwright browsers for PRs
        if: github.event_name == 'push' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @atlas/web exec playwright install chromium

  # Builds the static export with the published tiles (DATA.md §9), then runs the Playwright
  # smoke suite against it and checks the size budgets (ARCHITECTURE.md §8). The suite is split
  # across two runners: each test renders WebGL in software on a single worker. It waits for
  # `check`, so a lint, typecheck or unit failure doesn't also spend two e2e runners.
  e2e:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      ATLAS_REQUIRE_DETAILS: '1'
      # With this token, release assets download through the GitHub API (required for private repositories).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm data:fetch

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @atlas/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Must match the check job's shared browser-cache key.
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Azure mirror downloads can exhaust the job budget before any browser test starts.
      # Keep the runner's Ubuntu archive/security fallbacks for browser dependencies.
      - name: Use Ubuntu mirrors for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi

      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium

      # Prepares the static export before Playwright starts or reuses its web server.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      - name: Check browser shard duration
        if: always()
        run: pnpm check:e2e-budget --report=apps/web/test-results/shard-duration.json --shard=${{ matrix.shard }}/2

      - run: pnpm check:budgets
        if: matrix.shard == 1

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          # Traces of failed tests (retried once in CI, traced on the retry).
          name: playwright-results-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7
